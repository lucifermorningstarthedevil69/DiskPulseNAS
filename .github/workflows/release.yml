name: Build & Release Windows Executable

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build DiskPulse.exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install smartmontools (for embedding smartctl.exe)
        run: choco install smartmontools -y --no-progress

      - name: Build Standalone Executable
        run: |
          python build_exe.py

      - name: Package Release Zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/DiskPulse.exe -DestinationPath dist/DiskPulse-Windows-x64.zip

      - name: Upload Build Artifact (Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: DiskPulse-Windows-x64
          path: |
            dist/DiskPulse.exe
            dist/DiskPulse-Windows-x64.zip

      - name: Upload Binaries to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DiskPulse.exe
            dist/DiskPulse-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
